name: selftest
on: [push, pull_request]
jobs:
  battery:
    runs-on: ubuntu-latest
    steps:
      # The commit itself, never GitHub's synthetic pull-request merge commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The design-token gate rides CI: @shadcn/lint rules under the ratchet cap.
      - run: npx eslint . --max-warnings 0
      - run: npm run selftest
      # The server-side fence: re-judge what the event brings — a pull request
      # from its base, a push from the ref's previous tip, a new branch from the
      # default branch. (An unreachable base falls back to .picasso-base.)
      - run: node tools/task-coverage.mjs --base "${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || format('origin/{0}', github.event.repository.default_branch) }}"
      # The vendor-drift fence rides CI too: template/tools must stay byte-identical.
      - run: node tools/vendor-sync.mjs
      # Activate the committed hooks in this clone, then prove the wiring.
      - run: git config core.hooksPath .githooks
      - run: node tools/task-coverage.mjs --doctor
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The template is the first adapter at the stack seam; its green run is
      # its self-test. render:gate builds, then every ratchet judges.
      - run: npm --prefix template install --no-fund --no-audit
      - run: npm --prefix template run lint
      - run: npm --prefix template exec playwright install chromium --with-deps
      - name: resolve chromium for lighthouse
        run: echo "CHROME_PATH=$(cd template && node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - run: npm --prefix template run render:selftest
      - run: npm --prefix template run render:gate
      - run: npm --prefix template run budget:gate
      - run: npm --prefix template run perf:gate
      - run: npm --prefix template run selftest
